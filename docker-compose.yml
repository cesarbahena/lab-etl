version: '3.7'

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW_HOME: /opt/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql://quimios_dev:dev_password@postgres:5432/quimios_dev
    AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Mexico_City
    AIRFLOW_VAR_HUB_API_URL: http://app:8080
    AIRFLOW_VAR_LIMS_BASE_URL: http://webforms-mock:5150
    AIRFLOW_VAR_LIMS_USERNAME: demo_user
    AIRFLOW_VAR_LIMS_PASSWORD: demo_pass
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
  depends_on:
    - postgres

services:
  postgres:
    image: postgres:11.5-alpine
    environment:
      POSTGRES_USER: quimios_dev
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: quimios_dev
    ports:
      - '5433:5432'
    volumes:
      - quimios_dev_data:/var/lib/postgresql/data

  app:
    build:
      context: ../hub
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=quimios_dev;Username=quimios_dev;Password=dev_password
    ports:
      - '8080:8080'
    depends_on:
      - postgres

  webforms-mock:
    build:
      context: webforms_mock
    ports:
      - '5150:5150'

  airflow-init:
    <<: *airflow-common
    command: airflow initdb

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver -p 8090
    ports:
      - '8090:8090'

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler

volumes:
  quimios_dev_data:
